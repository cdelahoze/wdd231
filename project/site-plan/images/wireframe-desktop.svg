<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Courier New', Courier, monospace;">
  
  <style>
    .stroke-box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .stroke-dashed { fill: #ffffff; stroke: #000000; stroke-dasharray: 4; stroke-width: 1.5; }
    .title-text { font-weight: bold; font-size: 16px; fill: #000000; }
    .label-text { font-size: 13px; fill: #333333; }
    .sub-text { font-size: 11px; fill: #666666; }
    .btn-box { fill: #f0f0f0; stroke: #000000; stroke-width: 1.5; }
    .chip-box { fill: #ffffff; stroke: #000000; stroke-width: 1; rx: 10; ry: 10; }
  </style>

  <!-- Container / Outer Window -->
  <rect x="0" y="0" width="980" height="500" class="stroke-box" rx="6"/>
  
  <!-- Header Banner -->
  <rect x="15" y="15" width="950" height="45" class="stroke-box"/>
  <text x="310" y="43" class="title-text" font-size="18">TAKTAIM READER - ASSISTED READING TOOL</text>

  <!-- LEFT PANEL: TEXT EDITOR -->
  <g id="left-panel-desktop">
    <rect x="15" y="75" width="465" height="405" class="stroke-dashed"/>
    <text x="30" y="100" class="title-text">LEFT PANEL: Text Editor</text>
    
    <!-- Text Input Box -->
    <rect x="30" y="115" width="435" height="300" class="stroke-box"/>
    <text x="45" y="140" class="sub-text">Type or paste English text here...</text>
    <text x="45" y="170" class="label-text">Learning software development requires consistent practice.</text>
    <text x="45" y="190" class="label-text">When you highlight any word (e.g., <tspan font-weight="bold" fill="#000" text-decoration="underline">software</tspan>), it will be</text>
    <text x="45" y="210" class="label-text">automatically queried in the right dictionary panel.</text>
    
    <!-- Action Buttons -->
    <rect x="30" y="430" width="130" height="35" class="btn-box"/>
    <text x="48" y="452" class="label-text" font-weight="bold">[ Save Text ]</text>

    <rect x="170" y="430" width="130" height="35" class="btn-box"/>
    <text x="186" y="452" class="label-text">[ Clear Text ]</text>
  </g>

  <!-- RIGHT PANEL: DYNAMIC DICTIONARY -->
  <g id="right-panel-desktop">
    <rect x="500" y="75" width="465" height="405" class="stroke-dashed"/>
    <text x="515" y="100" class="title-text">RIGHT PANEL: Dynamic Dictionary</text>

    <!-- Word Search Bar -->
    <rect x="515" y="115" width="340" height="35" class="stroke-box"/>
    <text x="525" y="137" class="sub-text">software</text>
    <rect x="865" y="115" width="85" height="35" class="btn-box"/>
    <text x="883" y="137" class="label-text">Search</text>

    <!-- Search History -->
    <text x="515" y="170" class="sub-text">Recent History: [code] [learn] [developer]</text>

    <!-- Dictionary Result Card -->
    <rect x="515" y="185" width="435" height="280" class="stroke-box"/>
    <text x="530" y="215" class="title-text" font-size="20">software</text>
    <text x="650" y="215" class="sub-text">/ˈsɔftˌwɛr/</text>
    <circle cx="820" cy="210" r="12" class="btn-box"/>
    <text x="815" y="215" class="label-text">🔊</text>

    <text x="530" y="240" class="sub-text" font-style="italic">noun</text>
    <text x="530" y="265" class="label-text">• The programs and other operating information</text>
    <text x="545" y="285" class="label-text">used by a computer system.</text>

    <!-- Synonyms Section -->
    <text x="530" y="325" class="title-text" font-size="13">Synonyms (Click to lookup):</text>
    
    <rect x="530" y="340" width="70" height="25" class="chip-box"/>
    <text x="552" y="357" class="sub-text">app</text>

    <rect x="610" y="340" width="80" height="25" class="chip-box"/>
    <text x="622" y="357" class="sub-text">program</text>

    <rect x="700" y="340" width="70" height="25" class="chip-box"/>
    <text x="720" y="357" class="sub-text">code</text>
  </g>

</svg>
